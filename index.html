<html lang="en">
<head>

<link rel="manifest" href="./manifest.webmanifest">
<title>BETRIX | Football Intelligence</title>
<style>
:root{--bg:#0d1511;--panel:#141f19;--panel2:#1b2821;--row1:#18241d;--row2:#202d25;--text:#eef4ed;--muted:#91a197;--line:#29382f;--lime:#b8f36b;--green:#29432f;--red:#ff7777;--amber:#f2c879;--shadow:0 10px 30px #0003}
:root.light{--bg:#f3f6f0;--panel:#fff;--panel2:#edf2e9;--row1:#f5f8f2;--row2:#eaf0e6;--text:#17241b;--muted:#68776d;--line:#dce5d9;--lime:#a2d94d;--green:#e5f0dc;--red:#c64b48;--amber:#93651d;--shadow:0 8px 24px #20302010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;transition:background .2s,color .2s}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1000px;margin:auto;padding:0 14px 100px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(18px);padding:11px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;min-height:38px}.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.13em;font-size:16px;white-space:nowrap}.mark{width:32px;height:32px;border-radius:10px;background:var(--lime);color:#152117;display:grid;place-items:center;font-size:21px;font-weight:900}
.statusline{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block;flex:none}.dot.on{background:var(--lime)}
.top-actions{display:flex;align-items:center;gap:6px}.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:11px;display:grid;place-items:center;font-size:16px}.helpbtn{font-weight:900;font-size:13px}
button:active{transform:scale(.97)}main{padding-top:15px}
.toolbar{display:flex;gap:7px;align-items:center;margin:8px 0 12px}.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 10px;min-height:39px;min-width:0}.toolbar input{flex:1}.toolbar select{max-width:46%;font-size:12px}
.btn{border:0;border-radius:13px;background:var(--lime);color:#172117;font-weight:900;padding:12px 16px;transition:transform .15s,filter .2s}.btn:disabled{background:#414b44;color:#a0aaa2;opacity:.75;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;font-weight:700}.datebar{display:flex;gap:7px;overflow:auto;padding:2px 0 9px;scrollbar-width:none}.datechip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:750}.datechip.active{background:var(--green);border-color:var(--lime);color:var(--text)}
.competition{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;margin:12px 0;box-shadow:var(--shadow)}.competition-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;font-weight:850}.competition-head small{color:var(--muted);font-weight:600}.fixture{display:grid;grid-template-columns:48px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:11px 12px;min-height:57px;cursor:pointer}.fixture:nth-child(even){background:var(--row1)}.fixture:nth-child(odd){background:var(--row2)}.fixture-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.fixture-teams{min-width:0;font-size:13px;font-weight:750;line-height:1.35}.fixture-teams span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.teamline{display:flex!important;align-items:center;gap:7px;min-width:0}.teamline>span{min-width:0}.teamlogo{width:19px;height:19px;object-fit:contain;flex:none}.matchhero{display:flex;align-items:center;justify-content:center;gap:10px;margin:13px 0}.matchhero img{width:36px;height:36px;object-fit:contain}.matchhero h2{font-size:16px;text-align:center}.matchhero h2 span{color:var(--muted);font-size:12px;font-weight:500}.fixture-arrow{text-align:right;color:var(--lime);font-size:17px}
.empty{border:1px dashed var(--line);border-radius:15px;padding:23px 16px;text-align:center;color:var(--muted);background:var(--panel);font-size:13px}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.pill{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--muted);font-weight:800}.note{font-size:12px;color:var(--muted);line-height:1.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filterrow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filterchip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px;color:var(--muted);font-size:12px}.filterchip.active{border-color:var(--lime);background:var(--green);color:var(--text)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--panel) 95%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 3px;border-radius:11px;font-size:10px;font-weight:750}.nav button span{display:block;font-size:18px;margin-bottom:2px}.nav button.active{background:var(--green);color:var(--text)}
.remove{border:1px solid color-mix(in srgb,var(--red) 40%,transparent);background:transparent;color:var(--red);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800}.selection{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}.selection-info{min-width:0}.selection-info b{display:block;font-size:13px}.selection-info small{color:var(--muted);font-size:11px}
.analyze-wrap{display:flex;justify-content:center;margin:20px 0 8px}.analyze{width:min(100%,270px);min-height:48px;letter-spacing:.12em;font-size:13px}.analyze:disabled{background:#424b45;color:#aeb7b0}
.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{background:var(--panel2);border-radius:12px;padding:13px}.metric b{display:block;font-size:22px}.metric small{color:var(--muted);font-size:11px}
.modalback{position:fixed;inset:0;background:#0009;z-index:40;display:none;align-items:flex-end;justify-content:center;padding:12px}.modalback.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 14px 14px;width:min(100%,560px);max-height:88vh;overflow:auto;padding:18px;animation:rise .2s ease}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modal h2{margin:0;font-size:19px}.close{border:0;background:var(--panel2);border-radius:9px;padding:7px 10px}.fieldrow{margin:13px 0}.fieldrow label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:6px}.fieldrow input,.fieldrow select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px}.oddlist{margin:12px 0}.oddline{display:grid;grid-template-columns:42px 1fr auto auto;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.oddline small{color:var(--muted);font-size:10px}.oddline b{font-size:14px}.textbtn{border:0;background:transparent;color:var(--lime);font-weight:850;padding:6px}
.verdict{border-radius:12px;padding:13px;background:var(--panel2);margin:12px 0}.verdict strong{display:block;font-size:13px;letter-spacing:.05em;margin-bottom:4px}.verdict p{margin:0;color:var(--muted);font-size:12px}.loadingdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin:0 3px;animation:pulse .8s infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{to{opacity:.25;transform:scale(.7)}}
@media(min-width:700px){.app{padding-left:22px;padding-right:22px}.fixture{grid-template-columns:65px minmax(0,1fr) 70px;padding:13px 16px}.fixture-teams{display:block}.fixture-teams span{flex:1}}
@media(max-width:380px){.brand{font-size:14px}.statusline{font-size:9px}.top-actions{gap:4px}.iconbtn{width:31px;height:31px}.toolbar select{max-width:43%;padding:8px 7px}.fixture{grid-template-columns:42px minmax(0,1fr) 18px}.fixture-teams{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header><div class="top">
 <div class="brand"><div class="mark">⌁</div>BETRIX</div>
 <div class="statusline"><i class="dot" id="statusDot"></i><span id="statusText">Waiting for match data</span></div>
 <div class="top-actions"><button class="iconbtn" id="refreshBtn" aria-label="Refresh">↻</button><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button><button class="iconbtn helpbtn" id="helpBtn" aria-label="Help">?</button></div>
</div></header>
<main id="view"></main>
</div>
<nav class="nav">
<button class="active" data-page="matchday"><span>◫</span>Matchday</button>
<button data-page="catalyst"><span>✳</span>Catalyst</button>
<button data-page="coupon"><span>▤</span>Coupon Lab</button>
<button data-page="profile"><span>◉</span>Profile</button>
</nav>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h2 id="modalTitle">BETRIX</h2><button class="close" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const STORE={key:'betrix_football_key',fixtures:'betrix_football_fixtures',fixturesAt:'betrix_football_fixtures_at',predictions:'betrix_predictions',history:'betrix_history',theme:'betrix_theme',usage:'betrix_api_usage',odds:'betrix_odds_key',oddsCache:'betrix_odds_cache'};
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)??JSON.stringify(f))}catch{return f}};
const savedKey=localStorage.getItem(STORE.key)||'';
const getOddsKey=()=>localStorage.getItem(STORE.odds)||localStorage.getItem('oddsense_api_key')||localStorage.getItem('betrix_api_key')||'';
const state={page:'matchday',events:read(STORE.fixtures,[]),loading:false,error:'',date:'today',search:'',league:'all',coupon:[],history:read(STORE.history,[]),predictions:read(STORE.predictions,{}),results:read('betrix_prediction_results',{}),theme:localStorage.getItem(STORE.theme)||'dark',couponAnalyzing:false,oddsLoading:false,catalystRisk:(localStorage.getItem('betrix_risk')==='safer'?'safer':localStorage.getItem('betrix_risk')==='aggressive'?'risky':'all')};
document.documentElement.classList.toggle('light',state.theme==='light');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Algiers'});
const dayKey=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Algiers',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
const todayKey=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Algiers',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Algiers',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};
const tomorrowKey=()=>addDays(todayKey(),1);
function setStatus(t,on=false){$('#statusText').textContent=t;$('#statusDot').classList.toggle('on',on)}
function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();if(p==='profile')syncPredictionResults()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
$('#settingsBtn').onclick=openSettings;$('#helpBtn').onclick=openHelp;$('#closeModal').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});$('#refreshBtn').onclick=()=>refreshData(true);
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBack').classList.add('show')}
function closeModal(){$('#modalBack').classList.remove('show')}
const helpCopy={
 matchday:['Matchday','Football fixtures come directly from API-Football. Bookmaker odds are not used to load or control this page. Tap a match for its prediction, team comparison, recent form and head-to-head information when supplied.'],
 catalyst:['Catalyst','Saved match analyses appear here. A suggestion is only shown when the football-data provider returns a usable prediction. This feed is not a promise of profit and may be empty when evidence is unavailable.'],
 coupon:['Coupon Lab','Add match suggestions to build a coupon. Analysis checks duplicate matches, weak selections and concentration. Combined probability is not displayed unless the underlying probabilities and dependencies can be assessed reliably.'],
 profile:['Profile','Saved predictions are compared with completed fixture results when possible. Unresolved or unavailable results are not counted as wins or losses.']
};
function openHelp(){const [title,body]=helpCopy[state.page];openModal(title,`<p class="note" style="font-size:13px">${body}</p>`)}
function openSettings(){openModal('Settings',`
<div class="fieldrow"><label>FOOTBALL DATA · API-FOOTBALL</label><input id="footballKey" type="password" autocomplete="off" placeholder="Paste your API-Football key" value="${esc(localStorage.getItem(STORE.key)||'')}"><p class="note">Required for fixtures and match analysis. Stored in this browser on this device. A public website cannot keep a browser-side key fully secret.</p></div>
<div class="row"><button class="btn" id="saveKey">Save key</button><button class="secondary" id="testKey">Test connection</button></div>
<div class="fieldrow"><label>OPTIONAL BOOKMAKER ODDS · THE ODDS API</label><input id="oddsKey" type="password" autocomplete="off" placeholder="Optional odds key" value="${esc(getOddsKey())}"><p class="note">Secondary enrichment only. It never supplies fixtures. If unavailable or out of quota, Matchday and football analysis continue normally.</p></div>
<div class="row"><button class="secondary" id="saveOdds">Save odds key</button></div>
<div class="fieldrow"><label>DEFAULT RISK PROFILE</label><select id="riskSelect"><option value="balanced">Balanced</option><option value="safer">Safer</option><option value="aggressive">Higher risk</option></select></div>
<div class="fieldrow"><label>APPEARANCE</label><select id="themeSelect"><option value="dark" ${state.theme==='dark'?'selected':''}>Dark forest</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option></select></div>
<p class="note">Manual refresh is available from the top bar. Fixtures are cached for six hours. Match predictions are cached per fixture. Detailed requests are made only when you open a match.</p>`);
$('#saveKey').onclick=()=>{const k=$('#footballKey').value.trim();if(k)localStorage.setItem(STORE.key,k);else localStorage.removeItem(STORE.key);closeModal();setStatus(k?'Football data key saved':'No football data key saved')};
$('#testKey').onclick=async()=>{const k=$('#footballKey').value.trim();if(!k){alert('Paste your API-Football key first.');return}localStorage.setItem(STORE.key,k);const b=$('#testKey');b.disabled=true;b.textContent='Testing…';try{await api('status',false);closeModal();await refreshData(true)}catch(e){b.disabled=false;b.textContent='Test connection';alert('Connection test failed: '+e.message)}};
$('#saveOdds').onclick=()=>{const k=$('#oddsKey').value.trim();if(k)localStorage.setItem(STORE.odds,k);else localStorage.removeItem(STORE.odds);closeModal();setStatus(k?'Optional odds key saved':'Odds enrichment disabled')};
$('#themeSelect').onchange=e=>{state.theme=e.target.value;localStorage.setItem(STORE.theme,state.theme);document.documentElement.classList.toggle('light',state.theme==='light')};
$('#riskSelect').value=localStorage.getItem('betrix_risk')||'balanced';$('#riskSelect').onchange=e=>localStorage.setItem('betrix_risk',e.target.value);
}
function usageToday(){const u=read(STORE.usage,{});return u[todayKey()]||0}
function bumpUsage(){const u=read(STORE.usage,{});const k=todayKey();u[k]=(u[k]||0)+1;localStorage.setItem(STORE.usage,JSON.stringify(u))}
async function api(path,count=true){const key=localStorage.getItem(STORE.key)||'';if(!key)throw new Error('Add your API-Football key in Settings.');let r;try{r=await fetch('https://v3.football.api-sports.io/'+path,{method:'GET',headers:{'x-apisports-key':key}})}catch(e){throw new Error('Could not reach API-Football. Check your connection and try again.')}if(count)bumpUsage();let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.message||Object.values(data.errors||{}).join(' · ')||`Football data request failed (${r.status})`);if(data.errors&&Object.keys(data.errors).length)throw new Error(Object.values(data.errors).join(' · '));return data}
async function refreshData(force=false){
 if(state.loading)return;const key=localStorage.getItem(STORE.key);if(!key){openSettings();setStatus('Add football data key');return}
 const cachedAt=Number(localStorage.getItem(STORE.fixturesAt)||0);const fresh=state.events.length&&Date.now()-cachedAt<6*60*60*1000;
 if(fresh&&!force){setStatus(`${state.events.length} fixtures · cached`,true);render();return}
 state.loading=true;state.error='';setStatus('Loading football fixtures…');render();
 try{const d=todayKey(),end=addDays(d,6);const data=await api(`fixtures?from=${d}&to=${end}&timezone=Africa%2FAlgiers`);const rows=Array.isArray(data.response)?data.response:[];state.events=rows;localStorage.setItem(STORE.fixtures,JSON.stringify(rows));localStorage.setItem(STORE.fixturesAt,String(Date.now()));state.date='today';setStatus(`${rows.length} fixtures · updated`,true);if(!rows.length)state.error='The provider returned no fixtures in this seven-day window. Try another date or refresh later.'}
 catch(e){state.error=e.message||'Could not load fixtures';setStatus(state.events.length?'Showing saved fixtures · refresh failed':'Football data unavailable',false)}
 finally{state.loading=false;render()}
}
function dateName(d){const t=todayKey(),tom=tomorrowKey();if(d===t)return'TODAY';if(d===tom)return'TOMORROW';return new Date(d+'T12:00:00').toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}
function renderMatchday(){
 const dates=[...new Set(state.events.map(e=>dayKey(e.fixture.date)))].sort();const target=state.date==='today'?todayKey():state.date==='tomorrow'?tomorrowKey():state.date;
 const leagues=[...new Set(state.events.map(e=>e.league.name))].sort();
 const list=state.events.filter(e=>(state.date==='upcoming'?dayKey(e.fixture.date)>tomorrowKey():dayKey(e.fixture.date)===target)&&(state.league==='all'||e.league.name===state.league)&&(`${e.teams.home.name} ${e.teams.away.name} ${e.league.name}`).toLowerCase().includes(state.search.toLowerCase()));
 const groups={};list.forEach(e=>(groups[e.league.name||'Football']??=[]).push(e));
 return `<div class="datebar"><button class="datechip ${state.date==='today'?'active':''}" data-date="today">Today</button><button class="datechip ${state.date==='tomorrow'?'active':''}" data-date="tomorrow">Tomorrow</button><button class="datechip ${state.date==='upcoming'?'active':''}" data-date="upcoming">Upcoming</button>${dates.filter(d=>d!==todayKey()&&d!==tomorrowKey()).map(d=>`<button class="datechip ${state.date===d?'active':''}" data-date="${d}">${dateName(d)}</button>`).join('')}</div>
 <div class="toolbar"><input id="matchSearch" placeholder="Search matches…" value="${esc(state.search)}"><select id="leagueFilter"><option value="all">All competitions</option>${leagues.map(l=>`<option value="${esc(l)}" ${state.league===l?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
 ${state.loading?'<div class="empty">Loading fixtures…</div>':''}
 ${!state.events.length&&!state.loading?`<div class="empty"><strong>${state.error?'Fixtures unavailable':'No fixtures loaded'}</strong>${esc(state.error||'Connect your football data account to load today’s games.')}<p><button class="btn" id="connectBtn">Connect football data</button></p></div>`:''}
 ${Object.entries(groups).map(([league,events])=>`<section class="competition"><div class="competition-head"><span>${esc(league)}</span><small>${events.length} ${events.length===1?'MATCH':'MATCHES'}</small></div>${events.map(e=>`<div class="fixture" data-event="${e.fixture.id}"><span class="fixture-time">${fmtTime(e.fixture.date)}</span><div class="fixture-teams"><span class="teamline"><img class="teamlogo" src="${esc(e.teams.home.logo||'')}" alt="" loading="lazy" onerror="this.style.display='none'"><span>${esc(e.teams.home.name)}</span></span><span class="teamline"><img class="teamlogo" src="${esc(e.teams.away.logo||'')}" alt="" loading="lazy" onerror="this.style.display='none'"><span>${esc(e.teams.away.name)}</span></span></div><span class="fixture-arrow">${e.goals?.home!=null&&e.goals?.away!=null?`${e.goals.home} : ${e.goals.away}`:'›'}</span></div>`).join('')}</section>`).join('')}
 ${state.events.length&&!list.length?'<div class="empty">No fixtures match those filters.</div>':''}
 ${state.error&&state.events.length?`<p class="note">${esc(state.error)}</p>`:''}
 <p class="note">Fixtures supplied by API-Football · bookmaker odds do not control Matchday · ${usageToday()} football-data requests counted today on this device</p>`;
}
function recommendation(pred){const p=pred?.predictions||{};const pct=p.percent||{};const values=[['Home win',parseFloat(pct.home)],['Draw',parseFloat(pct.draw)],['Away win',parseFloat(pct.away)]].filter(x=>Number.isFinite(x[1]));values.sort((a,b)=>b[1]-a[1]);const advice=p.advice||'';if(advice)return {pick:advice,confidence:null,values,reason:'API-Football supplied this advice using its prediction algorithms and match-comparison data.'};if(values.length){return {pick:values[0][0],confidence:values[0][1],values,reason:'The strongest 1X2 estimate returned by API-Football. BETRIX labels the source and does not treat it as certainty.'}}const winner=p.winner?.name;return {pick:winner?`${winner} to win`:'No clear selection',confidence:null,values,reason:'The provider did not return enough probability information for a reliable selection.'}}
function formLine(form){if(!form)return '<span class="note">Not supplied</span>';return `<b>${esc(form)}</b>`}
function sportKeyFor(league){const n=(league||'').toLowerCase();if(n.includes('premier league'))return'soccer_epl';if(n.includes('la liga')||n.includes('primera division'))return'soccer_spain_la_liga';if(n.includes('bundesliga'))return'soccer_germany_bundesliga';if(n.includes('serie a'))return'soccer_italy_serie_a';if(n.includes('ligue 1'))return'soccer_france_ligue_one';if(n.includes('champions league'))return'soccer_uefa_champs_league';if(n.includes('europa league'))return'soccer_uefa_europa_league';if(n.includes('conference league'))return'soccer_uefa_europa_conference_league';return null}
async function getOdds(ev){const key=getOddsKey();if(!key)return null;const sport=sportKeyFor(ev.league.name);if(!sport)return null;const cache=read(STORE.oddsCache,{}),ck=sport;let rows=cache[ck]?.at&&Date.now()-cache[ck].at<15*60*1000?cache[ck].rows:null;try{if(!rows){const url=`https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${encodeURIComponent(key)}&regions=eu&markets=h2h&oddsFormat=decimal`;const res=await fetch(url);if(!res.ok)throw new Error(`Odds provider unavailable (${res.status})`);rows=await res.json();cache[ck]={at:Date.now(),rows};localStorage.setItem(STORE.oddsCache,JSON.stringify(cache))}const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');const match=rows.find(x=>norm(x.home_team)===norm(ev.teams.home.name)&&norm(x.away_team)===norm(ev.teams.away.name));if(!match)return null;const best={};for(const bm of match.bookmakers||[])for(const market of bm.markets||[])if(market.key==='h2h')for(const o of market.outcomes||[]){const k=o.name==='Draw'?'Draw':norm(o.name)===norm(ev.teams.home.name)?'Home win':norm(o.name)===norm(ev.teams.away.name)?'Away win':o.name;if(!best[k]||o.price>best[k].price)best[k]={price:o.price,bookmaker:bm.title}}return best}catch(e){return {error:e.message}}}
async function showInsight(id){
 const ev=state.events.find(e=>String(e.fixture.id)===String(id));if(!ev)return;const old=state.predictions[id];
 openModal('Mini-Catalyst',`<div class="note">${esc(ev.league.name)} · ${new Date(ev.fixture.date).toLocaleString([],{timeZone:'Africa/Algiers'})}</div><div class="matchhero"><img src="${esc(ev.teams.home.logo||'')}" alt="" onerror="this.style.display='none'"><h2>${esc(ev.teams.home.name)} <span>vs</span> ${esc(ev.teams.away.name)}</h2><img src="${esc(ev.teams.away.logo||'')}" alt="" onerror="this.style.display='none'"></div><div class="empty" id="miniResult"><span class="loadingdot"></span> ${old?'Loading saved analysis…':'Studying match data…'}</div>`);
 try{let pred=old?.data;if(!pred){const data=await api(`predictions?fixture=${id}`);pred=data.response?.[0];if(!pred)throw new Error('No prediction data is available for this fixture yet.');state.predictions[id]={data:pred,match:`${ev.teams.home.name} vs ${ev.teams.away.name}`,league:ev.league.name,date:ev.fixture.date,savedAt:Date.now(),fixtureId:id};localStorage.setItem(STORE.predictions,JSON.stringify(state.predictions));}
 const r=recommendation(pred);let fixtureStats=null;const statsCache=read('betrix_fixture_stats',{});const status=ev.fixture.status?.short||'NS';if(!['NS','TBD','PST','CANC','ABD','AWD','WO'].includes(status)){fixtureStats=statsCache[id];if(!fixtureStats){try{const sd=await api(`fixtures/statistics?fixture=${id}`);fixtureStats=sd.response||[];statsCache[id]=fixtureStats;localStorage.setItem('betrix_fixture_stats',JSON.stringify(statsCache))}catch(err){fixtureStats=null}}}const pct=r.values.length?r.values.map(x=>`<div class="row" style="justify-content:space-between"><span class="note">${x[0]}</span><b>${x[1]}%</b></div>`).join(''):'<p class="note">No percentage estimates were supplied for this match.</p>';const weak=/no clear selection/i.test(r.pick);const cmp=pred.comparison||{};const homeForm=pred.teams?.home?.league?.form||pred.teams?.home?.last_5||'';const awayForm=pred.teams?.away?.league?.form||pred.teams?.away?.last_5||'';const h2h=Array.isArray(pred.h2h)?pred.h2h.slice(0,5):[];
 $('#miniResult').outerHTML=`<div id="miniResult"><div class="verdict"><strong>${weak?'NO STRONG PICK':'PROVIDER SUGGESTION'}</strong><p>${esc(r.pick)}</p></div><div class="panel"><b>Outcome estimates · API-Football</b>${pct}</div><div class="panel"><b>Recent form</b><div class="row" style="justify-content:space-between"><span>${esc(ev.teams.home.name)}</span>${formLine(homeForm)}</div><div class="row" style="justify-content:space-between"><span>${esc(ev.teams.away.name)}</span>${formLine(awayForm)}</div><p class="note">Form is shown only when supplied by the provider.</p></div>${h2h.length?`<div class="panel"><b>Recent head-to-head</b>${h2h.map(x=>`<div class="selection"><div class="selection-info"><b>${esc(x.teams?.home?.name||'Home')} ${x.goals?.home??'–'} : ${x.goals?.away??'–'} ${esc(x.teams?.away?.name||'Away')}</b><small>${esc(x.fixture?.date||'')}</small></div></div>`).join('')}</div>`:''}${fixtureStats?.length?`<div class="panel"><b>Match statistics</b>${fixtureStats.map(team=>`<p class="note"><b>${esc(team.team?.name||'Team')}</b></p>${(team.statistics||[]).filter(x=>x.value!==null).map(x=>`<div class="row" style="justify-content:space-between"><span class="note">${esc(x.type)}</span><b>${esc(x.value)}</b></div>`).join('')}`).join('')}</div>`:''}<p class="note">${esc(r.reason)}</p><p class="note">This is a third-party model estimate, not a calibrated BETRIX probability. Availability of team news, lineups and statistics varies by competition.</p><div id="oddsResult" class="panel"><span class="note">${getOddsKey()?'Checking optional bookmaker prices…':'Optional odds comparison is not connected.'}</span></div>${!weak?'<button class="btn" id="addPick">Add suggestion to Coupon Lab</button>':''}</div>`;
 $('#addPick')?.addEventListener('click',()=>{state.coupon.push({match:`${ev.teams.home.name} vs ${ev.teams.away.name}`,pick:r.pick,probability:r.confidence,fixtureId:String(id),league:ev.league.name});closeModal();showPage('coupon')});
 if(getOddsKey()){const odds=await getOdds(ev);const el=$('#oddsResult');if(el){if(odds?.error)el.innerHTML='<b>Odds comparison unavailable</b><p class="note">Bookmaker data did not load. Football analysis is unaffected.</p>';else if(odds){el.innerHTML='<b>Best available decimal prices</b>'+Object.entries(odds).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span class="note">${esc(k)}</span><b>${v.price} <small class="note">${esc(v.bookmaker)}</small></b></div>`).join('')+'<p class="note">Prices are a snapshot and may change. They do not alter fixtures or provider predictions.</p>'}else el.innerHTML='<b>No matching bookmaker prices</b><p class="note">No matching market was returned for this match.</p>'}}
 }catch(e){const el=$('#miniResult');if(el)el.innerHTML=`<strong>Prediction unavailable</strong><p>${esc(e.message)}</p><p class="note">The fixture remains available. Prediction coverage may be missing for this competition or fixture.</p>`}
}
function renderCatalyst(){
 const all=Object.entries(state.predictions).filter(([id,x])=>x&&x.data).sort((a,b)=>(b[1].savedAt||0)-(a[1].savedAt||0));
 const items=all.filter(([id,x])=>{const p=recommendation(x.data).confidence;if(state.catalystRisk==='safer')return Number.isFinite(p)&&p>=65;if(state.catalystRisk==='balanced')return Number.isFinite(p)&&p>=50&&p<65;if(state.catalystRisk==='risky')return Number.isFinite(p)&&p<50;return true});
 const chips=['all','safer','balanced','risky'].map(k=>`<button class="filterchip ${state.catalystRisk===k?'active':''}" data-risk="${k}">${k==='all'?'All':k==='safer'?'Safer':k==='balanced'?'Balanced':'Riskier'}</button>`).join('');
 const cards=items.map(([id,x])=>{const r=recommendation(x.data);return `<section class="competition"><div class="competition-head"><span>${esc(x.league||'Football')}</span><small>${dateName(dayKey(x.date))}</small></div><div class="panel"><b>${esc(x.match)}</b><div class="verdict"><strong>${/no clear selection/i.test(r.pick)?'NO STRONG PICK':'SUGGESTED PLAY'}</strong><p>${esc(r.pick)}</p></div><p class="note">${Number.isFinite(r.confidence)?`Top outcome estimate: ${r.confidence}% · API-Football`:'No numerical 1X2 estimate returned'}</p><button class="secondary" data-event="${esc(id)}">Open analysis</button></div></section>`}).join('');
 const empty=`<div class="empty"><strong>${all.length?'No analyses in this risk band':'No saved Catalysts yet'}</strong>${all.length?'Try another risk filter.':'Open matches on Matchday to generate Mini-Catalysts. Recommendations are never fabricated.'}</div>`;
 return `<div class="filterrow">${chips}</div>${cards||empty}`;
}
function renderCoupon(){return `<section class="panel"><div class="row" style="justify-content:space-between"><b>Your selections</b><span class="pill">${state.coupon.length}</span></div>${state.coupon.length?state.coupon.map((x,i)=>`<div class="selection"><div class="selection-info"><b>${esc(x.match)}</b><small>${esc(x.pick)}${Number.isFinite(x.probability)?` · ${x.probability}% provider estimate`:''}</small></div><button class="remove" data-remove="${i}">Remove</button></div>`).join(''):'<p class="note">Add a suggestion from a match’s Mini-Catalyst.</p>'}</section><div class="analyze-wrap"><button class="btn analyze" id="analyzeBtn" ${state.coupon.length?'':'disabled'}>ANALYZE</button></div><div id="analysisResult"></div>`}

async function syncPredictionResults(){
 const ids=Object.entries(state.predictions).filter(([id,x])=>x?.fixtureId&&!state.results[id]).map(([id,x])=>String(x.fixtureId));
 if(!ids.length||!localStorage.getItem(STORE.key))return;
 const chunks=[];for(let i=0;i<ids.length;i+=20)chunks.push(ids.slice(i,i+20));
 for(const chunk of chunks){try{const d=await api(`fixtures?ids=${chunk.join('-')}&timezone=Africa%2FAlgiers`);for(const ev of d.response||[]){if(['FT','AET','PEN'].includes(ev.fixture?.status?.short)){state.results[String(ev.fixture.id)]={home:ev.goals?.home,away:ev.goals?.away,status:ev.fixture.status.short,date:ev.fixture.date};}}localStorage.setItem('betrix_prediction_results',JSON.stringify(state.results));}catch(e){setStatus('Profile results could not refresh',false);break}}
 render();
}
function renderProfile(){const saved=Object.values(state.predictions);let wins=0,losses=0,unresolved=0;for(const x of saved){const result=state.results[String(x.fixtureId)];if(!result){unresolved++;continue}const pick=recommendation(x.data).pick;let won=null;if(pick==='Home win')won=result.home>result.away;else if(pick==='Away win')won=result.away>result.home;else if(pick==='Draw')won=result.home===result.away;if(won===true)wins++;else if(won===false)losses++;else unresolved++}const n=wins+losses;return `<div class="metricgrid"><div class="metric"><b>${saved.length}</b><small>Saved match analyses</small></div><div class="metric"><b>${n?Math.round(wins/n*100)+'%':'—'}</b><small>Tracked 1X2 accuracy</small></div><div class="metric"><b>${wins} / ${losses}</b><small>Verified wins / losses</small></div><div class="metric"><b>${usageToday()}</b><small>Football requests today</small></div></div><section class="panel"><b>Prediction history</b>${saved.length?saved.slice().sort((a,b)=>(b.savedAt||0)-(a.savedAt||0)).map(x=>{const result=state.results[String(x.fixtureId)];return `<div class="selection"><div class="selection-info"><b>${esc(x.match)}</b><small>${esc(x.date)} · ${esc(recommendation(x.data).pick)}${result?` · Final ${result.home}-${result.away}`:' · Awaiting verified result'}</small></div></div>`}).join(''):'<p class="note">Predictions are saved when you open matches. Results are checked against completed fixtures when you visit this page.</p>'}<p class="note">${unresolved} saved predictions are not yet verifiable. Accuracy counts only clear 1X2 selections. This is model tracking, not your personal betting return.</p></section>`}

function render(){const v=$('#view');v.innerHTML=state.page==='matchday'?renderMatchday():state.page==='catalyst'?renderCatalyst():state.page==='coupon'?renderCoupon():renderProfile();$('#connectBtn')?.addEventListener('click',openSettings);$('#matchSearch')?.addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const el=$('#matchSearch');el.focus();el.setSelectionRange(pos,pos)});$('#leagueFilter')?.addEventListener('change',e=>{state.league=e.target.value;render()});document.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{state.date=b.dataset.date;render()}));document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>showInsight(b.dataset.event)));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{state.coupon.splice(Number(b.dataset.remove),1);render()}));document.querySelectorAll('[data-risk]').forEach(b=>b.addEventListener('click',()=>{state.catalystRisk=b.dataset.risk;render()}));$('#analyzeBtn')?.addEventListener('click',analyzeCoupon)}
async function analyzeCoupon(){if(!state.coupon.length||state.couponAnalyzing)return;const b=$('#analyzeBtn'),result=$('#analysisResult');state.couponAnalyzing=true;b.disabled=true;result.innerHTML='<div class="empty">Checking your selections…</div>';await new Promise(r=>setTimeout(r,250));const ids=state.coupon.map(x=>x.fixtureId);const dup=ids.some((x,i)=>ids.indexOf(x)!==i);const missing=state.coupon.some(x=>!Number.isFinite(x.probability));const weak=state.coupon.some(x=>Number.isFinite(x.probability)&&x.probability<45);const sameLeague=new Set(state.coupon.map(x=>x.league)).size===1&&state.coupon.length>1;let title='REVIEW YOUR COUPON',msg='Review each selection and its uncertainty before combining them.';if(dup){title='RETHINK';msg='The same match appears more than once. Keep only one selection per match.'}else if(weak){title='HIGHER UNCERTAINTY';msg='At least one selection has a lower provider 1X2 estimate. Consider removing weaker legs.'}else if(sameLeague){title='CONCENTRATED COUPON';msg='All selections come from one competition. Shared league-level factors may affect several legs.'}else if(missing){title='INSUFFICIENT PROBABILITY DATA';msg='One or more selections do not have a numerical 1X2 estimate. A combined win probability cannot be calculated honestly.'}else{title='STRUCTURE CHECK';msg='No duplicate fixtures detected. This is a structural review, not proof of positive expected value.'}result.innerHTML=`<div class="verdict"><strong>${title}</strong><p>${msg}</p></div><div class="panel"><b>${state.coupon.length} selections</b><p class="note">${missing?'Combined probability withheld because some legs lack numerical estimates.':'Individual estimates come from API-Football, not a calibrated BETRIX model.'} Coupon probability is not multiplied across legs because match outcomes may be dependent and the estimates have not been calibrated by BETRIX.</p></div>`;state.couponAnalyzing=false;b.disabled=false}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=4').catch(()=>{}))}
render();if(savedKey){const at=Number(localStorage.getItem(STORE.fixturesAt)||0);if(!state.events.length||Date.now()-at>6*60*60*1000){setStatus(state.events.length?'Showing cached fixtures':'Loading fixtures…');refreshData(false)}else setStatus(`${state.events.length} fixtures · cached`,true)}else setStatus(state.events.length?'Saved fixtures · connect for updates':'Connect football data');

</script>
